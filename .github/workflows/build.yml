name: Build Windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-x64

      - name: Install
        run: cmake --install build_x64 --prefix release --config RelWithDebInfo

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hide-studio-transition-panel-windows-x64
          path: release/
